name: Gluco
options:
  bundleIdPrefix: com.gluco
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: uk
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Gluco:
    type: application
    platform: iOS
    sources: [Gluco, Shared]
    scheme: {}
    info:
      path: Gluco/Info.plist
      properties:
        CFBundleDisplayName: Gluco
        CFBundleDevelopmentRegion: uk
        CFBundleLocalizations: [uk]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ALTAppGroups: [group.com.gluco.app]
    entitlements:
      path: Gluco/Gluco.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gluco.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gluco.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GlucoWidget
  GlucoWidget:
    type: app-extension
    platform: iOS
    sources: [GlucoWidget, Shared]
    info:
      path: GlucoWidget/Info.plist
      properties:
        CFBundleDisplayName: Gluco
        CFBundleDevelopmentRegion: uk
        ALTAppGroups: [group.com.gluco.app]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GlucoWidget/GlucoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.gluco.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gluco.app.widget
