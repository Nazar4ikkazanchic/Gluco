name: Build Gluco
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set +e
          xcodebuild -project Gluco.xcodeproj -scheme Gluco -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          CODE=$?
          grep -E "error:" build.log | sort -u | head -80
          grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          if [ $CODE -ne 0 ]; then tail -60 build.log; exit $CODE; fi
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Gluco.app
          codesign --force --sign - --entitlements GlucoWidget/GlucoWidget.entitlements "$APP/PlugIns/GlucoWidget.appex"
          codesign --force --sign - --entitlements Gluco/Gluco.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Gluco.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Gluco-ipa
          path: Gluco.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
